<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天界入境審査庁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<script>
  (function(d) {
    var config = {
      kitId: 'fmw0xoi',
      scriptTimeout: 3000,
      async: true
    },
    h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
  })(document);
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ローディング画面 -->
<div class="loading-screen" id="loading-screen">
  <div class="loading-text" id="loading-text">
    <span style="--i:0">l</span><span style="--i:1">o</span><span style="--i:2">a</span><span style="--i:3">d</span><span style="--i:4">i</span><span style="--i:5">n</span><span style="--i:6">g</span><span style="--i:7">…</span>
  </div>
</div>

<!-- 固定ヘッダー -->
<header class="fixed-header">
  <a href="#top" class="header-logo">
    <img src="images/titlerogo.webp" alt="タイトルロゴ" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <span class="logo-fallback" style="display:none;">TITLE</span>
  </a>
  
  <button class="menu-btn" id="menu-btn" aria-label="メニューを開く">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<!-- 全画面ナビゲーション -->
<nav class="full-nav" id="full-nav" hidden>
  <ul class="nav-list">
    <li><a href="#top" class="nav-link">TOP</a></li>
    <li><a href="#intro-sec" class="nav-link">INTRODUCTION</a></li>
    <li><a href="#chara-sec" class="nav-link">CHARACTER</a></li>
    <li><a href="#flow-sec" class="nav-link">GAME FLOW</a></li>
    <li><a href="#event-sec" class="nav-link">EVENT INFO</a></li>
    <li><a href="#goods-sec" class="nav-link">GOODS</a></li>
    <li><a href="#food-sec" class="nav-link">FOOD</a></li>
  </ul>
</nav>

<!-- ================= トップページ ================= -->
<main class="top-page" id="top">
  <!-- トップヒーロー -->
  <div class="top-hero">
    <img src="images/top.webp" alt="メインビジュアル" onerror="this.parentElement.style.display='none';">
    <div class="hero-logo-wrap">
      <img src="images/titlerogo.webp" alt="タイトルロゴ" class="hero-logo" onerror="this.style.display='none'">
    </div>
  </div>

  <div class="top-body">
    <!-- INTRODUCTION セクション -->
    <section class="sec-intro" id="intro-sec">
      <div class="intro-outer-box">
        <h2 class="section-title title-in-box">INTRODUCTION</h2>
        <p class="intro-text">
          ここにゲームと世界観の短い紹介文を書きます。
        </p>
      </div>

      <!-- ダイヤ型装飾 -->
      <div class="diamond-decor">
        <span class="d-item d-purple p1"></span>
        <span class="d-item d-beige p2"></span>
        <span class="d-item d-purple p3"></span>
        <span class="d-item d-beige p4"></span>
        <div class="icon-wrap">
          <img src="images/icon.webp" alt="アイコン" onerror="this.style.display='none'">
        </div>
        <span class="d-item d-beige p4"></span>
        <span class="d-item d-purple p3"></span>
        <span class="d-item d-beige p2"></span>
        <span class="d-item d-purple p1"></span>
      </div>
    </section>

    <!-- CHARACTER セクション -->
    <section class="sec-chara" id="chara-sec">
      <h2 class="section-title">CHARACTER</h2>
      <ul class="chara-grid-2col" id="chara-grid"></ul>
    </section>

    <!-- FLOW セクション -->
    <section class="sec-flow" id="flow-sec">
      <h2 class="section-title">GAME FLOW</h2>
      <div class="flow-list" id="flow-list"></div>
    </section>

    <!-- EVENT INFO セクション -->
    <section class="sec-event" id="event-sec">
      <h2 class="section-title">EVENT INFO</h2>
      <div class="event-card" id="event-card"></div>
    </section>

<!-- GOODS セクション -->
<section class="sec-goods" id="goods-sec">
  <h2 class="section-title">GOODS</h2>
  <p class="goods-location-note">8-206教室で販売(参加者のみ購入可能)</p>
  <div class="goods-list-vert" id="goods-grid"></div>
</section>

<!-- FOOD セクション -->
<section class="sec-food" id="food-sec">
  <h2 class="section-title">FOOD</h2>
  <p class="goods-location-note">※広場前で販売</p>
  <div class="food-grid" id="food-grid"></div>
</section>
</div>
</main>

<!-- ================= キャラ詳細ページ ================= -->
<article class="detail-page" id="detail" hidden>
  <div class="detail-container">
    <div class="stage" id="stage">
      <button class="nav-arrow prev" id="prev-btn" aria-label="前のキャラクター">‹</button>
      
      <div class="art-wrap" id="art-wrap">
        <div class="art" id="art"></div>
        <div class="vertical-quote" id="vertical-quote"></div>
      </div>

      <button class="nav-arrow next" id="next-btn" aria-label="次のキャラクター">›</button>
    </div>

<!-- キャラ紹介（フルネーム＋説明文） -->
<div class="chara-info" id="chara-info"></div>

<!-- ④ 白色カーブくびれダイヤ4つ区切り -->
<div class="diamond-divider">
  <svg class="curved-diamond" viewBox="0 0 24 24"><path d="M12 2 C12 8 8 12 2 12 C8 12 12 16 12 22 C12 16 16 12 22 12 C16 12 12 8 12 2 Z"/></svg>
  <svg class="curved-diamond" viewBox="0 0 24 24"><path d="M12 2 C12 8 8 12 2 12 C8 12 12 16 12 22 C12 16 16 12 22 12 C16 12 12 8 12 2 Z"/></svg>
  <svg class="curved-diamond" viewBox="0 0 24 24"><path d="M12 2 C12 8 8 12 2 12 C8 12 12 16 12 22 C12 16 16 12 22 12 C16 12 12 8 12 2 Z"/></svg>
  <svg class="curved-diamond" viewBox="0 0 24 24"><path d="M12 2 C12 8 8 12 2 12 C8 12 12 16 12 22 C12 16 16 12 22 12 C16 12 12 8 12 2 Z"/></svg>
</div>

    <section class="others-sec">
      <h3 class="section-title" style="margin-top:0;">CHARACTER</h3>
      <ul class="chara-grid-2col" id="others-grid"></ul>
    </section>
  </div>
</article>

<!-- フッター -->
<footer class="site-footer">
  <p class="credit">制作 カイシゼミ14期生</p>
  <div class="sns-links">
    <a href="https://x.com/kaishizemi14" class="twitter-btn" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
      <img src="images/X-icon.webp" alt="Twitter" onerror="this.parentElement.innerHTML='X';">
    </a>
  </div>
</footer>

<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
